server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/ticketsupport_users?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 0977 # CHANGE THIS TO YOUR MYSQL PASSWORD
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
    show-sql: false

app:
  cors:
    allowed-origin: http://localhost:5173
